defaults:
  - override hydra/launcher: submitit_local

# =========================
# Environment (CAG_eve)
# =========================
task: cag-eve-nav      
obs: dict_state               
episodic: true            

  model_folder: 
  insertion_vessel_name: 
  insertion_point_idx: 1

  insertion_direction_idx_diff: 5
  approx_branch_radii: 5.0
  check_if_points_in_mesh: false

  # ---- simulation ----
  friction: 0.001

  # ---- fluoroscopy ----
  image_frequency: 7.5
  image_rot_zx: [20, 5]

  # ---- target ----
  target_threshold: 10
  branches:

  # ---- episode / truncation ----
  max_steps: 400
  max_device_length: 500

  # ---- observation ----
  n_points: 20

  # ---- reward ----
  r_target: 5.0
  r_path: 0.1
  r_error: 1.0

  # ---- misc ----
  vis: false

  # ---- interimtarget ----
  resolution: 20

  # ---- truncation ----
  max_step_time: 10

  # =========================
  # Render
  # =========================
  network_pkl: ""
  ppa: 30
  psa: 20
  seed: 10
  csv: ""

# =========================
# Evaluation
# =========================
checkpoint: ""           
eval_episodes: 1
eval_freq: 800

# =========================
# Training
# =========================
steps: 10_000_000
batch_size: 512
reward_coef: 0.1
value_coef: 0.1
termination_coef: 1
consistency_coef: 20
rho: 0.5
lr: 3e-4
enc_lr_scale: 0.3
grad_clip_norm: 20
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995
buffer_size: 1_000_000
exp_name: default
data_dir: ./data          

# =========================
# Planning (MPC)
# =========================
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
horizon: 3
min_std: 0.05
max_std: 2
temperature: 0.5

# =========================
# Actor
# =========================
log_std_min: -10
log_std_max: 2
entropy_coef: 1e-4

# =========================
# Critic
# =========================
num_bins: 101
vmin: -10
vmax: 10

# =========================
# Architecture
# =========================
model_size: 19           
num_enc_layers: 2
enc_dim: 128
num_channels: 32
mlp_dim: 512
latent_dim: 256
task_dim: 96
num_q: 5
dropout: 0.01
simnorm_dim: 8

# =========================
# Logging
# =========================
wandb_project: cag-tdmpc2  
wandb_entity: null         
wandb_silent: false
enable_wandb: true        
save_csv: true
save_freq: 5000

# =========================
# Misc
# =========================
compile: false
save_video: false
save_agent: true
seed: 1
work_dir: ./logs/cag-eve-nav_v1/1/default/eval_video/           
task_title: cag-eve-nav    


# =========================
# Convenience 
# =========================
multitask: false           
tasks: null                
obs_shape:
  dict_state: [44]
action_dim: null           
episode_length: null       
obs_shapes: null          
action_dims: null          
episode_lengths: null      
seed_steps: 10           
bin_size: null             

n_episodes: 3

